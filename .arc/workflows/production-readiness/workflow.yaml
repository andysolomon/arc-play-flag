  - id: "4.37"
    kind: leaf
    title: "#37 Commit executable Demo recording workflow and deterministic fixtures"
    parent_id: "4.0"
    nesting_depth: 1
    outcome: A committed development-only recorder with fictional fixtures regenerates every demo chapter from a clean checkout with one command, in a disposable browser profile, failing clearly when a beat does not match.
    scope: scripts/ (recorder), DEMO_WORKFLOW.md, components/demo/demos.ts, package.json
    acceptance_criteria:
      - Recording script, fixtures, chapter actions and timing are committed; tool versions pinned
      - One-chapter and all-chapters commands with an explicit output directory
      - Disposable browser profile; a coach's real data is never touched
      - Clear failure on a missing selector, wrong state, export or recording beat
      - Regeneration verified from a clean checkout; manifest and size checks retained
    dependencies: ["3.35"]
    preserved_behavior: Existing clips, manifest checks and WebM/MP4 delivery keep working until regenerated.
    checkpoint:
      state: completed
      updated_at: "2026-09-11T21:17:24.000Z"
      evidence_ref: "PR #54"
  - id: "4.36"
    kind: leaf
    title: "#36 Make Demo chapters readable and accurately demonstrate their coverage"
    parent_id: "4.0"
    nesting_depth: 1
    outcome: Every advertised feature is shown as a completed action in a focused, legible chapter, regenerated with the committed recorder against the current interface.
    scope: components/demo/demos.ts, components/demo/DemoClip.tsx, public demo assets, DEMO_WORKFLOW.md
    acceptance_criteria:
      - Every covers entry matches a completed action in its clip
      - Overloaded chapters are split; budgets revised deliberately
      - Active controls are framed or zoomed with readable captions
      - Movement, run, pass, play-action, coverage, saving, exports, playbooks, team and import are shown
      - Clips reviewed at phone width with refreshed interface visuals
    dependencies: ["4.37", "3.31"]
    preserved_behavior: Lazy loading, one active clip and efficient delivery are retained; the playback chapter just shows a play running.
    checkpoint:
      state: planned
      updated_at: "2026-09-08T00:00:00.000Z"

  # ── 5. Establish the release gate ─────────────────────────────────────────
  - id: "5.0"
    kind: group
    title: Establish the release gate
    parent_id: null
    nesting_depth: 0
    dependencies: []
    checkpoint:
      state: ready
      updated_at: "2026-09-08T00:00:00.000Z"
  - id: "5.38"
    kind: leaf
    title: "#38 Add browser journey regression tests to pull-request CI"
    parent_id: "5.0"
    nesting_depth: 1
    outcome: Isolated browser tests against a production build run on every pull request, covering the saving, history, playbook, import, sharing and export journeys, with traces on failure and a concise summary.
    scope: .github/workflows/pr.yml, package.json, a browser test directory with fictional fixtures
    acceptance_criteria:
      - Browser tests run against a production build in CI with fictional per-test fixtures
      - Create, edit, save, reload, reopen, A to B to undo to save, New play, duplicate and custom primary mirror or flip are covered
      - Playbook create, add, reorder, validated import, backup round-trip, sharing visibility and export states are covered
      - Offline and deterministic playback coverage is added as those fixes land
      - Traces and screenshots upload on failure; lint, typecheck, unit tests and build remain gates
    dependencies: ["1.25", "1.26", "1.27", "1.29"]
    preserved_behavior: The existing Merge Gate and commitlint checks are unchanged; no real browser data is touched.
    checkpoint:
      state: completed
      updated_at: "2026-09-09T00:20:00.000Z"
      evidence_ref: "PR #45"
  - id: "5.39"
    kind: leaf
    title: "#39 Add production error recovery, diagnostics, and a release rollback runbook"
    parent_id: "5.0"
    nesting_depth: 1
    outcome: Unexpected failures land on a recoverable error UI that protects unsaved work, actionable errors are captured without play contents or personal data, and release verification, monitoring and rollback are documented and rehearsed.
    scope: app/layout.tsx and route error boundaries, components/App.tsx, a diagnostics module, .github/workflows/release.yml, a runbook document
    acceptance_criteria:
      - Recoverable route and global error UI with safe retry or reload and an unsaved-work warning
      - Errors captured with release and browser context, excluding play contents, notes, share payloads and personal data
      - Report-a-problem entry and concise storage and privacy information
      - Release verification, monitoring ownership and rollback documented; a rollback verified safely
      - Reporting failure never blocks drawing or saving and degrades gracefully offline
    dependencies: ["1.25"]
    preserved_behavior: Drawing, saving and the failed-save download keep working when reporting is unavailable.
    checkpoint:
      state: completed
      updated_at: "2026-09-09T21:10:00.000Z"
      evidence_ref: "PR #46"
  - id: "5.40"
    kind: leaf
    title: "#40 Complete real-device, print, offline, and coach-pilot release validation"
    parent_id: "5.0"
    nesting_depth: 1
    outcome: The critical journeys pass on iPad Safari, iPhone Safari, Android Chrome and desktop keyboard; wristbands and binders print at actual size; offline paths work on devices; and a 3 to 5 coach pilot completes a practice workflow with recorded outcomes against a defined go or no-go.
    scope: a validation record under docs/, physical devices and printers, pilot coaches
    acceptance_criteria:
      - Device, browser and version recorded for each platform with results
      - Create, draw, coverage, playback, save, reload, book, share and export exercised on each
      - Touch targets, scrolling, orientation, focus, screen-reader basics and downloads verified
      - Offline fresh and repeat visits, deep links, watched demos and post-deploy updates tested
      - Actual-size Letter and A4 wristbands and binders verified; season-sized library exercised; pilot friction recorded
    dependencies: ["2.28", "2.30", "2.32", "5.38", "5.39"]
    preserved_behavior: Coaches' private plays are never published; postcards and flyers stay outside this gate.
    checkpoint:
      state: cancelled
      updated_at: "2026-09-11T16:39:30.000Z"
      evidence_ref: "issue #40, closed as not planned"

