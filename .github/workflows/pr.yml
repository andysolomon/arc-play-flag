name: PR Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

jobs:
  commitlint:
    name: Validate Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate commit messages
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SHARING_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate local service configuration
        run: docker compose config --quiet
      - name: Validate ADR numbers
        run: bun run scripts/check-adr-ids.ts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  models:
    name: Model-check the sync protocols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Refuse protocol changes that leave their model behind
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun run scripts/check-model-drift.ts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tla2tools
          key: tla2tools-${{ hashFiles('scripts/verify-models.ts') }}
      - run: bun run verify:models

  infrastructure:
    name: Validate infrastructure configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check infra
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate

  journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHARING_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:3134
      UPSTASH_REDIS_REST_TOKEN: fixture-only
      # the organization journey's disposable database (docs/runbook/organizations.md); migrated by the journeys' global setup
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    # four browser projects (desktop, two phones, a tablet) share the two workers
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Build the production bundle
        run: bun run build
      - name: Run the browser journeys against the production build
        run: bun run test:e2e
      - name: Upload the journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
