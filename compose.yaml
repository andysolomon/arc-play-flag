name: arc-play-flag-local

# Local services only. The Next.js app runs with Bun; production stays on Vercel.
# Match managed PostgreSQL 18 and the Redis version used by the browser journeys in CI.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: arc_play_flag
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "arc_play_flag"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres18-data:
  redis-data:
