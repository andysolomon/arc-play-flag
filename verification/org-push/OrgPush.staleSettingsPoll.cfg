\* expect: NoStaleTake
\* replays: a poll the server answered before this device's settings push, landing after it, put the older settings back on the device (for good while a write still moved d.rev, see writeAdvancesRev)
CONSTANTS
  Edits = {e1, e2}
  Others = {o1}
  Bumps = 1
  Variant = "staleSettingsPoll"
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEdit HonestSaved NoStaleTake QuietAgrees
CONSTRAINT RevBound
CHECK_DEADLOCK FALSE
