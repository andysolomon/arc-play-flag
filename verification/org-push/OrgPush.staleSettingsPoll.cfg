\* expect: QuietAgrees
\* replays: a poll the server answered before this device's settings push, landing after it, put the older settings back on the device for good
CONSTANTS
  Edits = {e1, e2}
  Others = {o1}
  Bumps = 1
  Variant = "staleSettingsPoll"
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEdit HonestSaved QuietAgrees
CONSTRAINT RevBound
CHECK_DEADLOCK FALSE
