\* expect: HonestSaved
\* replays: settle() said saved after its push whatever the push left pending, so an edit made just after a reload showed as saved before it went up
CONSTANTS
  Edits = {e1, e2}
  Others = {o1}
  Bumps = 1
  Variant = "settleSaysSaved"
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEdit HonestSaved NoStaleTake QuietAgrees
CONSTRAINT RevBound
CHECK_DEADLOCK FALSE
