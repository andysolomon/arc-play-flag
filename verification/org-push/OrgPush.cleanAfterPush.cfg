\* expect: HonestSaved
\* replays: before #184, push() ended by clearing the marker and saying saved whatever the device held by then, so an edit made during the push was lost to a reload (e2e journey "a team rename made as its settings push lands survives a reload straight after")
CONSTANTS
  Edits = {e1, e2}
  Others = {o1}
  Bumps = 1
  Variant = "cleanAfterPush"
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEdit HonestSaved QuietAgrees
CONSTRAINT RevBound
CHECK_DEADLOCK FALSE
