\* expect: HonestSaved
\* replays: before #180, push() hashed the settings as they were when writeSettings resolved, so an edit made during the PUT was taken as sent and never went up (e2e journey "a team rename made while a settings push is on its way still reaches the organization")
CONSTANTS
  Edits = {e1, e2}
  Others = {o1}
  Bumps = 1
  Variant = "hashAfterAwait"
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEdit HonestSaved NoStaleTake QuietAgrees
CONSTRAINT RevBound
CHECK_DEADLOCK FALSE
