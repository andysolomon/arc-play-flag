<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;border:var(--border);border-radius:var(--radius-tile);overflow:hidden;box-shadow:var(--shadow-tile);background:var(--cream)}.sw i{display:block;height:58px}.sw b{display:block;font-weight:400;font-size:14px;padding:5px 8px 1px}.sw small{display:block;font-size:12px;color:var(--ink-muted);padding:0 8px 6px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--ink-route)"></i><b>--ink-route</b><small>offense route</small></div><div class="sw"><i style="background:var(--ink-primary-read)"></i><b>--ink-primary-read</b><small>primary read</small></div><div class="sw"><i style="background:var(--ink-zone-deep)"></i><b>--ink-zone-deep</b><small>deep / man</small></div><div class="sw"><i style="background:var(--ink-zone-flat)"></i><b>--ink-zone-flat</b><small>flat zone</small></div><div class="sw"><i style="background:var(--ink-curl-flat)"></i><b>--ink-curl-flat</b><small>curl-flat</small></div><div class="sw"><i style="background:var(--ink-blitz)"></i><b>--ink-blitz</b><small>blitz</small></div></div></body></html>
