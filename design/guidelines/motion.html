<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;border:var(--border);border-radius:var(--radius-tile);overflow:hidden;box-shadow:var(--shadow-tile);background:var(--cream)}.sw i{display:block;height:58px}.sw b{display:block;font-weight:400;font-size:14px;padding:5px 8px 1px}.sw small{display:block;font-size:12px;color:var(--ink-muted);padding:0 8px 6px}</style></head><body><style>@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.3;transform:scale(1.16)}}@keyframes boing{0%{transform:scale(.84)}55%{transform:scale(1.13)}100%{transform:scale(1)}}@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}</style><div class="row" style="align-items:center;gap:28px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:46px;height:46px;border-radius:50%;background:var(--offense);border:var(--border-w-token) solid var(--ink);animation:boing 1.4s var(--ease-boing) infinite"></div><span style="font-size:13px">boing · 360ms · drop</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="position:relative;width:46px;height:46px"><div style="position:absolute;inset:-6px;border-radius:50%;border:5px solid var(--yellow);animation:pulse 1.25s ease-in-out infinite"></div><div style="width:46px;height:46px;border-radius:50%;background:var(--defense);border:var(--border-w-token) solid var(--ink)"></div></div><span style="font-size:13px">pulse · 1.25s · selected</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><svg width="120" height="46" viewBox="0 0 120 46"><path d="M6 40 L6 14 L100 14" fill="none" stroke="var(--ink-route)" stroke-width="5" stroke-linecap="round" stroke-dasharray="300" style="animation:draw 1.2s ease-out infinite"/><polygon points="116,14 100,6 100,22" fill="var(--ink-route)"/></svg><span style="font-size:13px">draw · 320ms · route placed</span></div><div style="font-size:14px;color:var(--ink-muted);max-width:170px;line-height:1.3">Panels slide width in 180ms ease. Hover lifts tiles 2px; pills turn soft yellow.</div></div></body></html>
