<!-- @dsCard group="Effects" viewport="700x160" subtitle="Ink borders, hard shadows, pill or 14px" name="Borders, radii, shadows" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;border:var(--border);border-radius:var(--radius-tile);overflow:hidden;box-shadow:var(--shadow-tile);background:var(--cream)}.sw i{display:block;height:58px}.sw b{display:block;font-weight:400;font-size:14px;padding:5px 8px 1px}.sw small{display:block;font-size:12px;color:var(--ink-muted);padding:0 8px 6px}</style></head><body><div class="row" style="align-items:stretch"><div style="flex:1;padding:12px;border:var(--border);border-radius:var(--radius-pill);background:var(--white);text-align:center;font-size:15px">pill · 2px ink</div><div style="flex:1;padding:12px;border:var(--border);border-radius:var(--radius-tile);background:var(--white);box-shadow:var(--shadow-tile);text-align:center;font-size:15px">tile · 14px · 0 3px 0</div><div style="flex:1;padding:12px;border:var(--border);border-radius:var(--radius-note);background:var(--yellow);text-align:center;font-size:15px">note · 12px</div><div style="flex:1;padding:12px;border:var(--border-w-field) solid var(--ink);border-radius:var(--radius-field);background:var(--turf);box-shadow:var(--shadow-field);text-align:center;font-size:15px">field · 3px · 0 7px 0</div></div><p style="margin:10px 0 0;font-size:14px;color:var(--ink-muted)">Shadows have zero blur: things sit on the paper like stickers. No greys in borders, ever.</p></body></html>
