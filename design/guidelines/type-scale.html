<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;border:var(--border);border-radius:var(--radius-tile);overflow:hidden;box-shadow:var(--shadow-tile);background:var(--cream)}.sw i{display:block;height:58px}.sw b{display:block;font-weight:400;font-size:14px;padding:5px 8px 1px}.sw small{display:block;font-size:12px;color:var(--ink-muted);padding:0 8px 6px}</style></head><body><div style="display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:baseline">
<span style="font-size:20px">New play</span><span style="font-size:13px;color:var(--ink-muted)">--text-header 20px · play name</span>
<span style="font-size:18px">Pick a route</span><span style="font-size:13px;color:var(--ink-muted)">--text-title 18px · panel titles</span>
<span style="font-size:17px">Play name</span><span style="font-size:13px;color:var(--ink-muted)">--text-input 17px · text fields</span>
<span style="font-size:16px">Save · Undo · Tap a player</span><span style="font-size:13px;color:var(--ink-muted)">--text-base 16px · buttons, body</span>
<span style="font-size:14px">Clear routes</span><span style="font-size:13px;color:var(--ink-muted)">--text-caption 14px · tile labels, helper copy</span>
<span style="font-size:13px;letter-spacing:2px;color:var(--ink-muted)">ROUTES</span><span style="font-size:13px;color:var(--ink-muted)">--text-eyebrow 13px · uppercase, 2px tracking</span></div></body></html>
