<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;border:var(--border);border-radius:var(--radius-tile);overflow:hidden;box-shadow:var(--shadow-tile);background:var(--cream)}.sw i{display:block;height:58px}.sw b{display:block;font-weight:400;font-size:14px;padding:5px 8px 1px}.sw small{display:block;font-size:12px;color:var(--ink-muted);padding:0 8px 6px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--offense)"></i><b>--offense</b><small>#e5675e</small></div><div class="sw"><i style="background:var(--defense)"></i><b>--defense</b><small>#4a8fe0</small></div><div class="sw"><i style="background:var(--turf)"></i><b>--turf</b><small>#c1f0c1</small></div><div class="sw"><i style="background:var(--turf-endzone)"></i><b>--turf-endzone</b><small>#a7e5a7</small></div></div></body></html>
