<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;border:var(--border);border-radius:var(--radius-tile);overflow:hidden;box-shadow:var(--shadow-tile);background:var(--cream)}.sw i{display:block;height:58px}.sw b{display:block;font-weight:400;font-size:14px;padding:5px 8px 1px}.sw small{display:block;font-size:12px;color:var(--ink-muted);padding:0 8px 6px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--yellow)"></i><b>--yellow</b><small>#f2b705 active</small></div><div class="sw"><i style="background:var(--yellow-soft)"></i><b>--yellow-soft</b><small>#ffe9a8 hover</small></div><div class="sw"><i style="background:var(--rose-soft)"></i><b>--rose-soft</b><small>primary read on</small></div><div class="sw"><i style="background:var(--link)"></i><b>--link</b><small>links</small></div><div class="sw"><i style="background:var(--link-hover)"></i><b>--link-hover</b><small>link hover</small></div></div></body></html>
