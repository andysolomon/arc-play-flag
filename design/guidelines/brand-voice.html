<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;border:var(--border);border-radius:var(--radius-tile);overflow:hidden;box-shadow:var(--shadow-tile);background:var(--cream)}.sw i{display:block;height:58px}.sw b{display:block;font-weight:400;font-size:14px;padding:5px 8px 1px}.sw small{display:block;font-size:12px;color:var(--ink-muted);padding:0 8px 6px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;font-size:16px;line-height:1.35"><div><span style="font-size:13px;letter-spacing:2px;color:var(--ink-muted)">DO</span><br>Tap a player to give them a route.<br>Cover who? Tap a red player.<br>Clear and reset only touch the team you're showing.</div><div><span style="font-size:13px;letter-spacing:2px;color:var(--ink-muted)">DON'T</span><br>Please select a player entity to assign a route.<br>Error: no target specified.<br>⚠️ Warning! This action cannot be undone!</div></div></body></html>
