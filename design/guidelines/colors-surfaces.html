<!-- @dsCard group="Colors" viewport="700x150" subtitle="Paper, cream and ink" name="Surfaces & ink" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;border:var(--border);border-radius:var(--radius-tile);overflow:hidden;box-shadow:var(--shadow-tile);background:var(--cream)}.sw i{display:block;height:58px}.sw b{display:block;font-weight:400;font-size:14px;padding:5px 8px 1px}.sw small{display:block;font-size:12px;color:var(--ink-muted);padding:0 8px 6px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--paper)"></i><b>--paper</b><small>#f4efe2 page</small></div><div class="sw"><i style="background:var(--cream)"></i><b>--cream</b><small>#fffdf6 panels</small></div><div class="sw"><i style="background:var(--white)"></i><b>--white</b><small>controls</small></div><div class="sw"><i style="background:var(--ink)"></i><b>--ink</b><small>#1b1a17 text/borders</small></div><div class="sw"><i style="background:var(--ink-muted)"></i><b>--ink-muted</b><small>#6f6c66 captions</small></div><div class="sw"><i style="background:var(--paper-2)"></i><b>--paper-2</b><small>disabled fill</small></div></div></body></html>
