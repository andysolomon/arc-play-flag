<!-- @dsCard group="Components" viewport="700x300" name="Core — Button, IconTile, SectionLabel" subtitle="Pills, sticker tiles, eyebrows" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../ds-load.js"></script>
<style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
dsLoad('../../').then(NS => {
const { Button, IconTile, TileGrid, SectionLabel, Divider } = NS;
const I = (n) => '../../assets/icons/' + n + '.png';
function Demo() {
  const [on, setOn] = React.useState('go');
  return (
    <div style={{ display: 'flex', gap: 24 }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: 240 }}>
        <SectionLabel>Buttons</SectionLabel>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          <Button>Save</Button><Button variant="active">Both</Button><Button variant="dark">Export PNG</Button>
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          <Button size="sm">⇄ Mirror route</Button><Button size="sm" disabled>Redo ↷</Button>
        </div>
        <Divider />
        <SectionLabel>Eyebrow + divider</SectionLabel>
        <span style={{ fontSize: 14, color: 'var(--ink-muted)' }}>13px · 2px tracking · muted</span>
      </div>
      <div style={{ width: 240, display: 'flex', flexDirection: 'column', gap: 10 }}>
        <SectionLabel>Icon tiles</SectionLabel>
        <TileGrid>
          {['go', 'out', 'slant', 'post', 'curl', 'deselectOff'].map(k =>
            <IconTile key={k} icon={I(k)} label={k === 'deselectOff' ? 'Done' : k[0].toUpperCase() + k.slice(1)} active={on === k} onClick={() => setOn(k)} />)}
        </TileGrid>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
