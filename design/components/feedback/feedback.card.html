<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../ds-load.js"></script>
<style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-hand);color:var(--ink)}</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
dsLoad('../../').then(NS => {
const { Toast, Note, EmptyState } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ display: 'flex', gap: 24, alignItems: 'flex-start' }}>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12, width: 300 }}>
      <Toast>Cover who? Tap a red player.</Toast>
      <Note>Tap waypoints on the field · double-tap to finish</Note>
    </div>
    <div style={{ width: 240 }}>
      <EmptyState icon="../../assets/icons/football.png">Tap a player to give them a route.<br/>Drag to move them.</EmptyState>
    </div>
  </div>
);
});
</script></body></html>
